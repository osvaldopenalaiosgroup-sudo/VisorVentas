<style>
  /* Layout: one continuous 3D scene for a TV. Zona › Proyecto › Unidad. One left panel whose content follows the camera level, a narrow level rail on the right, tools bottom-right. Sizes scale with the screen width so text reads from 2–3 m. */
  :root {
    --brand: #132f33;
    --accent: #dda11b;
    --sky-top: #cfdfe2;

    --panel-solid: #ffffff;
    --panel-2: #f2f0eb;
    --ink: #132f33;
    --muted: #5a6967;
    --line: rgba(19, 47, 51, .13);
    --on: #132f33;
    --on-ink: #f6f4ef;
    --ok: #2f8a5f; --ok-bg: rgba(47, 138, 95, .13);
    --warn: #9a6c06; --warn-bg: rgba(221, 161, 27, .18);
    --sold: #5f5b55; --sold-bg: rgba(95, 91, 85, .13);
    --plan-bg: #ffffff; --plan-ink: #132f33; --plan-muted: #6b7876; --plan-corr: #ece8de; --plan-core: #cfcac0; --plan-sel: #dda11b;
    --shadow: 0 10px 30px rgba(19, 47, 51, .16);
    --font-display: "Anton", Impact, "Arial Narrow", sans-serif;
    --font-body: "Archivo", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky-top: #1b3236; --sky-bottom: #0e1d20;
      --panel: rgba(16, 35, 38, .95); --panel-solid: #112629; --panel-2: #193437;
      --ink: #ece8de; --muted: #a2b3b0; --line: rgba(236, 232, 222, .14);
      --on: #dda11b; --on-ink: #132f33;
      --ok: #5cc28f; --ok-bg: rgba(92, 194, 143, .15);
      --warn: #e7b443; --warn-bg: rgba(231, 180, 67, .16);
      --sold: #b9b4aa; --sold-bg: rgba(185, 180, 170, .14);
      --plan-bg: #0f2427; --plan-ink: #e6e2d8; --plan-muted: #9db0ad; --plan-corr: #1b383c; --plan-core: #2b4649;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --sky-top: #1b3236; --sky-bottom: #0e1d20;
    --panel: rgba(16, 35, 38, .95); --panel-solid: #112629; --panel-2: #193437;
    --ink: #ece8de; --muted: #a2b3b0; --line: rgba(236, 232, 222, .14);
    --on: #dda11b; --on-ink: #132f33;
    --ok: #5cc28f; --ok-bg: rgba(92, 194, 143, .15);
    --warn: #e7b443; --warn-bg: rgba(231, 180, 67, .16);
    --sold: #b9b4aa; --sold-bg: rgba(185, 180, 170, .14);
    --plan-bg: #0f2427; --plan-ink: #e6e2d8; --plan-muted: #9db0ad; --plan-corr: #1b383c; --plan-core: #2b4649;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; font-size: clamp(13px, calc(0.72vw + 4px), 22px); }
  body {

    color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.4;
  }
  button, input, select { font: inherit; color: inherit; }

  .muted { color: var(--muted); }

  #app { position: relative; height: 100%; overflow: hidden; }
  #stage { position: absolute; inset: 0; touch-action: none; }

  .ptag .n { width: 1.7rem; height: 1.7rem; border-radius: 50%; background: #132f33; color: #fff; display: grid; place-items: center; font-size: .85rem; }
  .ptag small { font: 500 .8rem var(--font-mono); color: #5a6967; }

  .projtag span { font-size: .85rem; font-weight: 600; }

  .tip { position: absolute; left: 0; top: 0; pointer-events: none; background: #132f33; color: #f6f4ef; padding: .45rem .7rem; border-radius: .45rem; font-size: .9rem; font-weight: 500; white-space: nowrap; box-shadow: var(--shadow); }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; font: .9rem var(--font-mono); color: var(--muted); }

  .float { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: .9rem; box-shadow: var(--shadow); backdrop-filter: blur(10px); }

  /* top bar */
  .topbar { position: absolute; top: .9rem; left: max(.9rem, env(safe-area-inset-left, 0px)); right: max(.9rem, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: .8rem; pointer-events: none; flex-wrap: wrap; }
  .topbar > * { pointer-events: auto; position: static; }

  .crumbs { display: flex; align-items: center; gap: .3rem; padding: .35rem; }

  .crumb:disabled { cursor: default; opacity: .5; }
  .sep { color: var(--muted); font-size: 1.1rem; }
  .top-right { margin-left: auto; display: flex; gap: .6rem; align-items: center; }
  .top-right > * { position: static; }
  .seg { display: flex; padding: .3rem; gap: .2rem; }
  .seg button { border: 0; background: transparent; padding: .45rem .8rem; border-radius: .55rem; font-weight: 700; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }
  .topbtn { display: inline-flex; align-items: center; gap: .5rem; padding: .7rem 1rem; font-weight: 600; cursor: pointer; }
  .topbtn svg, .tool svg { width: 1.15rem; height: 1.15rem; flex: none; }

  /* left panel */
  .panel { left: max(.9rem, env(safe-area-inset-left, 0px)); top: 5.2rem; bottom: .9rem; width: 25rem; display: flex; flex-direction: column; overflow: hidden; }
  .panel-body { overflow-y: auto; padding: 1.3rem 1.4rem 1.5rem; display: grid; gap: 1.2rem; align-content: start; min-height: 0; flex: 1; }
  .panel h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 2.6rem; line-height: 1; letter-spacing: .02em; }
  .panel h2 { margin: 0; font-size: 1.4rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
  .group { display: grid; gap: .55rem; }
  .poi-list { display: grid; }
  .poi { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: .7rem; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: .75rem 0; cursor: pointer; font-size: 1.05rem; }
  .poi .n { width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--on); color: var(--on-ink); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
  .poi b { font: 600 1rem var(--font-mono); }
  .poi.on { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: .45rem; }
  .chip { border: 1px solid var(--line); background: var(--panel-solid); padding: .55rem .9rem; border-radius: 999px; font-size: .95rem; font-weight: 600; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--on); color: var(--on-ink); border-color: var(--on); }
  .range2 { display: grid; gap: .3rem; }
  .range2 input { width: 100%; accent-color: #dda11b; }
  .range2 .vals { display: flex; justify-content: space-between; font: 600 .95rem var(--font-mono); }
  .check { display: flex; align-items: center; gap: .6rem; font-size: 1rem; cursor: pointer; }
  .check input { accent-color: #dda11b; width: 1.2rem; height: 1.2rem; }
  .count { display: flex; align-items: center; justify-content: space-between; background: var(--panel-2); border-radius: .7rem; padding: .7rem .9rem; }
  .count b { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; line-height: 1; }
  .linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-weight: 600; padding: .3rem; }
  .stack { display: grid; gap: .35rem; }
  .srow { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr); gap: .45rem; align-items: start; }
  .slabel { font: 600 .85rem var(--font-mono); color: var(--muted); padding-top: .55rem; }
  .scells { display: flex; flex-wrap: wrap; gap: .3rem; }
  .cell { min-width: 2.9rem; border: 2px solid transparent; border-radius: .4rem; padding: .35rem .3rem; cursor: pointer; color: #fff; display: grid; justify-items: center; line-height: 1.1; }
  .cell b { font-size: .95rem; } .cell small { font-size: .7rem; opacity: .92; }
  .cell.c-disponible { background: #3f9d6b; } .cell.c-reservado { background: #b8860b; } .cell.c-vendido { background: #8e8a82; }
  .cell.dim { opacity: .22; }
  .cell.sel { border-color: var(--ink); }
  .btn { display: inline-flex; justify-content: center; align-items: center; gap: .5rem; padding: .9rem 1rem; border-radius: .7rem; font-weight: 700; font-size: 1.05rem; cursor: pointer; border: 1px solid transparent; width: 100%; }
  .btn-gold { background: var(--accent); color: #132f33; }
  .btn-line { background: var(--panel-solid); border-color: var(--line); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .back { border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; font-size: 1rem; justify-self: start; }
  .ftitle { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
  .ftitle h2 { font-family: var(--font-display); font-weight: 400; font-size: 2.3rem; line-height: 1; }
  .pill { font: 600 .78rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; padding: .3rem .6rem; border-radius: .35rem; }
  .st-disponible { color: var(--ok); } .pill.st-disponible { background: var(--ok-bg); }
  .st-reservado { color: var(--warn); } .pill.st-reservado { background: var(--warn-bg); }
  .st-vendido { color: var(--sold); } .pill.st-vendido { background: var(--sold-bg); }
  .price-row { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; }
  .price { font-family: var(--font-display); font-size: 2.3rem; line-height: 1; }
  .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .4rem; }
  .fact { background: var(--panel-2); border-radius: .6rem; padding: .6rem .55rem; display: grid; gap: .1rem; min-width: 0; }
  .fact b { font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fact span { font-size: .78rem; color: var(--muted); }
  .tabs3 { display: flex; gap: .25rem; background: var(--panel-2); padding: .25rem; border-radius: .7rem; }
  .tabs3 button { flex: 1; border: 0; background: transparent; padding: .65rem .4rem; border-radius: .55rem; font-weight: 700; font-size: .95rem; cursor: pointer; }
  .tabs3 button[aria-selected="true"] { background: var(--on); color: var(--on-ink); }
  .plan { border: 1px solid var(--line); border-radius: .6rem; background: var(--plan-bg); padding: .35rem; }
  .plan svg { display: block; width: 100%; height: auto; }
  .renders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .4rem; }
  .render { aspect-ratio: 4 / 3; max-width: 100%; border-radius: .5rem; background: repeating-linear-gradient(135deg, var(--panel-2) 0 12px, transparent 12px 24px); border: 1px solid var(--line); display: grid; place-items: center; text-align: center; font-size: .8rem; color: var(--muted); padding: .4rem; }
  .actions2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .5rem; }
  .reopen { left: max(.9rem, env(safe-area-inset-left, 0px)); top: 5.2rem; padding: .8rem 1rem; font-weight: 700; cursor: pointer; display: inline-flex; gap: .5rem; align-items: center; }
  .iconbtn { border: 1px solid var(--line); background: var(--panel-solid); border-radius: .6rem; width: 2.8rem; height: 2.8rem; font-size: 1.3rem; cursor: pointer; flex: none; }

  /* level rail */
  .rail { right: max(.9rem, env(safe-area-inset-right, 0px)); top: 5.2rem; width: 4.4rem; padding: .35rem; display: grid; gap: .2rem; max-height: calc(100% - 11rem); overflow-y: auto; }
  .lvl { border: 0; background: transparent; border-radius: .6rem; padding: .45rem 0; cursor: pointer; display: grid; justify-items: center; gap: .05rem; }
  .lvl b { font-size: 1.15rem; }
  .lvl small { font: 500 .68rem var(--font-mono); color: var(--muted); }
  .lvl:hover { background: var(--panel-2); }
  .lvl[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }
  .lvl[aria-pressed="true"] small { color: inherit; opacity: .8; }

  /* toolbar */
  .toolbar { right: max(.9rem, env(safe-area-inset-right, 0px)); bottom: calc(.9rem + env(safe-area-inset-bottom, 0px)); display: flex; gap: .25rem; padding: .35rem; max-width: calc(100% - 28rem); flex-wrap: wrap; justify-content: flex-end; }
  .tool { border: 0; background: transparent; padding: .65rem .85rem; border-radius: .6rem; cursor: pointer; font-weight: 700; font-size: .95rem; display: inline-flex; gap: .45rem; align-items: center; white-space: nowrap; }
  .tool:hover { background: var(--panel-2); }

  /* 360 overlay */
  .v360ui { position: absolute; inset: 0; pointer-events: none; }
  .v360ui > * { pointer-events: auto; }
  .v-back { position: absolute; left: max(.9rem, env(safe-area-inset-left, 0px)); top: 5.2rem; padding: .8rem 1.1rem; font-weight: 700; cursor: pointer; }
  .v-label { position: absolute; right: max(.9rem, env(safe-area-inset-right, 0px)); top: 5.2rem; padding: .8rem 1.1rem; text-align: right; display: grid; gap: .1rem; }

  .v-rooms button { border: 0; background: transparent; padding: .75rem 1rem; border-radius: .6rem; font-weight: 700; cursor: pointer; }
  .v-rooms button[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }
  .v-mini { position: absolute; right: max(.9rem, env(safe-area-inset-right, 0px)); bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); width: 17rem; padding: .4rem; }
  .v-mini svg { display: block; width: 100%; height: auto; }
  .v-hint { position: absolute; left: max(.9rem, env(safe-area-inset-left, 0px)); bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); padding: .7rem 1rem; font-size: .95rem; }

  .exit-present { right: max(.9rem, env(safe-area-inset-right, 0px)); bottom: calc(.9rem + env(safe-area-inset-bottom, 0px)); padding: .7rem 1rem; font-weight: 700; cursor: pointer; opacity: .55; }
  .exit-present:hover { opacity: 1; }
  body.present .topbar, body.present .panel, body.present .rail, body.present .toolbar, body.present .reopen { display: none; }

  /* broker */
  .modal-bg { position: absolute; inset: 0; background: rgba(10, 24, 27, .5); display: grid; place-items: center; z-index: 20; padding-left: max(1rem, env(safe-area-inset-left, 0px)); padding-right: max(1rem, env(safe-area-inset-right, 0px)); }
  .broker-card { position: relative; width: min(78rem, 100%); max-height: calc(100% - 3rem); display: flex; flex-direction: column; overflow: hidden; }
  .broker-card.login { width: min(26rem, 100%); }
  .bk-head { display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--line); }
  .bk-head h2 { margin: 0; font-size: 1.4rem; }
  .bk-body { padding: 1.2rem 1.4rem; overflow: auto; display: grid; gap: 1rem; min-height: 0; }
  .bk-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; }
  .bk-kpi { background: var(--panel-2); border-radius: .6rem; padding: .7rem .9rem; display: grid; gap: .1rem; }
  .bk-kpi b { font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; line-height: 1; }
  .bk-kpi span { font-size: .85rem; color: var(--muted); }
  .bk-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: .6rem; }
  table { border-collapse: collapse; width: 100%; min-width: 60rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--line); font-size: .95rem; vertical-align: middle; }

  tr.focus td { background: var(--warn-bg); }
  td select { min-width: 8.5rem; }
  td input, td select { background: var(--panel-solid); border: 1px solid var(--line); border-radius: .4rem; padding: .4rem .5rem; width: 100%; }
  td input[type="number"] { width: 8.5rem; font-family: var(--font-mono); }
  .days { display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; }
  .days button { border: 1px solid var(--line); background: var(--panel-solid); border-radius: .4rem; padding: .3rem .5rem; cursor: pointer; font-weight: 600; font-size: .85rem; }
  .soon { color: var(--sold); font-weight: 700; }
  .login-form { padding: 1.4rem; display: grid; gap: .9rem; }
  .login-form label { display: grid; gap: .3rem; font: 500 .78rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .login-form input { background: var(--panel-solid); border: 1px solid var(--line); border-radius: .5rem; padding: .7rem .8rem; font-size: 1rem; text-transform: none; letter-spacing: 0; font-family: var(--font-body); color: var(--ink); }
  .x { border: 0; background: none; font-size: 1.8rem; line-height: 1; cursor: pointer; color: var(--muted); margin-left: auto; padding: .2rem .4rem; }


  .bk-over { position: absolute; inset: 0; background: rgba(10, 24, 27, .45); display: grid; place-items: center; padding: 1rem; z-index: 2; }
  .bk-dialog { position: relative; width: min(30rem, 100%); max-height: 100%; overflow-y: auto; padding: 1.4rem; display: grid; gap: .9rem; background: var(--panel-solid); }
  .bk-dialog h3 { margin: 0; font-size: 1.4rem; }

  const k = b.dataset.bk;
  if (k === 'close') closeBroker();
  if (k === 'cancel') { state.auth2 = null; renderBroker(); }
  if (k === 'mailok') { state.mail = null; renderBroker(); }
});
bkCard.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (d.price) { unitById[d.price].price = Math.max(0, Number(el.value) || 0); renderBroker(); refresh(); return; }
  if (d.estado) {
    const u = unitById[d.estado];
    if (el.value === u.status) return;
    state.auth2 = { id: u.id, to: el.value, days: 15, cliente: u.cliente, tel: u.telefono, correo: u.correo, err: '' };
    el.value = u.status; renderBroker(); return;
  }
  if (d.field) { unitById[d.u][d.field] = el.value.trim(); }
});
bk.addEventListener('click', e => { if (e.target === bk) closeBroker(); });

/* ================= TOP BAR ================= */
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang; document.documentElement.lang = lang;
  document.querySelectorAll('[data-lang]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.lang === lang)));
  refresh(); renderBroker();
}));
$('#btn-broker').addEventListener('click', () => openBroker(state.sel));
function setPresent(on) {
  state.present = on; document.body.classList.toggle('present', on);
  $('#exit-present').hidden = !on; $('#exit-present').textContent = t('salirPres');
  applyOffset();
}
$('#btn-present').addEventListener('click', () => setPresent(true));
$('#exit-present').addEventListener('click', () => setPresent(false));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!bk.hidden) { if (state.auth2 || state.mail) { state.auth2 = null; state.mail = null; return renderBroker(); } return closeBroker(); }
  if (state.present) return setPresent(false);
  if (state.mode === 'v360') return exit360();
  if (state.balcon) return toggleBalcon();
  if (state.mode === 'unidad') return goProyecto(false);
});

function applyOffset() {
  const host = document.getElementById('stage'), w = host.clientWidth, h = host.clientHeight;
  const p = document.getElementById('panel'), r = document.getElementById('rail');
  if (w > 820 && !document.body.classList.contains('present')) {
    const left = p && !p.hidden ? p.offsetWidth + 24 : 0, right = r && !r.hidden ? r.offsetWidth + 24 : 0;
    camera.setViewOffset(w, h, -(left - right) / 2, 0, w, h);
  } else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
const skyEl = $('#sky');
function renderSky() {
  skyEl.hidden = state.mode === 'v360';
  if (skyEl.hidden) return;
  skyEl.innerHTML = `
    <div class="sky-time"><span class="eyebrow">${t('hora')} · ${t('clima')}</span><b id="sky-h">${fmtHour(state.hour)}</b></div>
    <input id="sky-range" type="range" min="5" max="21" step="0.25" value="${state.hour}" aria-label="${t('hora')}">
    <div class="sky-w" role="group" aria-label="${t('clima')}">${WEATHER.map(w => `<button type="button" data-w="${w}" aria-pressed="${state.weather === w}" title="${t('w_' + w)}" aria-label="${t('w_' + w)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${W_ICONS[w]}</svg></button>`).join('')}</div>`;
  placeSky();
}
function placeSky() {
  const tb = $('#toolbar');
  skyEl.style.bottom = !tb.hidden && innerWidth > 820 ? `calc(${tb.offsetHeight}px + 1.5rem + env(safe-area-inset-bottom, 0px))` : '';
}
addEventListener('resize', placeSky);
skyEl.addEventListener('input', e => { if (e.target.id !== 'sky-range') return; state.hour = Number(e.target.value); $('#sky-h').textContent = fmtHour(state.hour); applySky(); paint(); });
skyEl.addEventListener('click', e => { const b = e.target.closest('[data-w]'); if (!b) return; state.weather = b.dataset.w; applySky(); paint(); renderSky(); });
function refresh() {
  applySky(); paint(); renderCrumbs(); renderRail(); renderToolbar(); renderSky(); renderPanel(); renderV360(); renderZonaTags();
  $('#lbl-broker').textContent = t('broker'); $('#lbl-present').textContent = t('presentar');
}

/* ================= PICKING ================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const buildingMeshes = []; LEVELS.forEach(L => levelGroups[L.id].traverse(o => { if (o.isMesh) buildingMeshes.push(o); }));
function castAt(ev) { const r = renderer.domElement.getBoundingClientRect(); ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); }
function pickUnit(ev) {
  if (!(state.mode === 'proyecto' || state.mode === 'unidad') || state.balcon) return null;
  castAt(ev);
  const iso = state.level !== null;
  const targets = iso ? zonePlates.filter(p => p.visible) : unitGlass.filter(m => m.parent.visible);
  const hit = ray.intersectObjects(targets, false).find(h => !state.corte || h.point.z >= -8.7);
  return hit ? hit.object.userData.unit : null;
}
const cv = renderer.domElement, tip = $('#tip'); let down = null;
cv.addEventListener('pointermove', ev => {
  if (ev.pointerType !== 'mouse' || ev.buttons) { tip.hidden = true; return; }
  const id = pickUnit(ev);
  cv.style.cursor = id ? 'pointer' : state.mode === 'v360' || state.balcon ? 'move' : 'grab';
  if (id !== state.hover) { state.hover = id; paint(); }
  if (id) {
    const u = unitById[id], r = host.getBoundingClientRect();
    tip.hidden = false;
    tip.textContent = `${unitName(u)} · ${t('type_' + u.type)} · ${fmtK(u.price)} · ${t('st_' + u.status)}`;
    tip.style.transform = `translate(${ev.clientX - r.left + 16}px, ${ev.clientY - r.top + 16}px)`;
  } else tip.hidden = true;
});
cv.addEventListener('pointerleave', () => { tip.hidden = true; });
cv.addEventListener('pointerdown', ev => { down = { x: ev.clientX, y: ev.clientY }; });
cv.addEventListener('pointerup', ev => {
  if (!down || Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 6) { down = null; return; }
  down = null;
  if (state.mode === 'zona') { castAt(ev); if (ray.intersectObjects(buildingMeshes, false).length) goProyecto(true); return; }
  const id = pickUnit(ev); if (id) selectUnit(id);
});

/* ================= LOOP ================= */
const clock = new THREE.Clock(), tmp = new THREE.Vector3(), dir = new THREE.Vector3();
function place(el, pos) {
  tmp.copy(pos).project(camera);
  const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.05 && Math.abs(tmp.y) < 1.05;
  el.hidden = !vis;
  if (vis) el.style.transform = `translate(${(tmp.x * .5 + .5) * host.clientWidth}px, ${(-tmp.y * .5 + .5) * host.clientHeight}px) translate(-50%, -100%)`;
}
function placeTags() {
  const zona = state.mode === 'zona';
  poiTags.forEach((p, i) => zona && state.cats.has(POIS[i].cat) ? place(p.el, p.pos) : (p.el.hidden = true));
  roadTags.forEach(r => zona ? place(r.el, r.pos) : (r.el.hidden = true));
  zona ? place(projTag, projTagPos) : (projTag.hidden = true);
  ringTags.forEach(r => zona ? place(r.el, r.pos) : (r.el.hidden = true));
  const showUnits = state.level !== null && (state.mode === 'proyecto' || state.mode === 'unidad') && !state.balcon;
  UNITS.forEach(u => (showUnits && u.level === state.level) ? place(u.tag, u.tagPos) : (u.tag.hidden = true));
}
function loop() {
  requestAnimationFrame(loop);
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05), time = clock.elapsedTime;
  if (tween) {
    tween.t = Math.min(1, tween.t + Math.min(raw, 0.12) / tween.dur);
    const k = tween.t < 0.5 ? 4 * tween.t ** 3 : 1 - Math.pow(-2 * tween.t + 2, 3) / 2;
    camera.position.lerpVectors(tween.fp, tween.tp, k); controls.target.lerpVectors(tween.ft, tween.tt, k);
    camera.lookAt(controls.target);
    if (tween.t >= 1) tween = null;
  } else controls.update();
  if (state.vida && !reduceMotion) people.forEach(p => {
    if (!p.g.parent.visible) return;
    if (p.wait > 0) { p.wait -= dt; return; }
    dir.subVectors(p.target, p.g.position); dir.y = 0;
    const d = dir.length();
    if (d < 0.15) { p.wait = 0.8 + p.rand() * 2.5; pickTarget(p); return; }
    dir.normalize(); p.g.position.addScaledVector(dir, Math.min(d, p.speed * dt));
    p.g.rotation.y = Math.atan2(dir.x, dir.z);
    p.g.children[1].position.y = 1.15 + Math.abs(Math.sin(time * 7 + p.phase)) * 0.04;
  });
  if (state.vida) updateCars(reduceMotion ? 0 : dt);
  updateRoutes(dt, time);
  if (rain.visible) updateRain(reduceMotion ? 0 : dt);
  if (fpLight.intensity) fpLight.position.copy(camera.position);
  renderer.render(scene, camera);
  placeTags();
}

state.f = state.f; setControls('zona');
refresh(); camZona(true);
$('#loading').hidden = true;
loop();

</script>
